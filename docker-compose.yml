services:
  backend:
    build:
      context: ./backend
    container_name: workease-backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: workease-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    container_name: workease-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend

    restart: unless-stopped